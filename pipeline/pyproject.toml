[project]
name = "atlas-pipeline"
version = "2.0.0-m0"
description = "Place database pipeline and gates for the Travelers World Map"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "numpy>=1.26", "pillow>=10.0"]
geo = ["numpy>=1.26", "pillow>=10.0", "rasterio>=1.3", "shapely>=2.0", "pyshp>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"atlas/gates.py" = ["E501"]
"atlas/bundle.py" = ["E501"]
"atlas/verify.py" = ["E501"]
"atlas/kinds.py" = ["E501"]
"atlas/minting.py" = ["E501"]
"atlas/qids.py" = ["E501"]
"atlas/snapshot.py" = ["E501"]
"atlas/wikidata.py" = ["E501"]
"atlas/extract.py" = ["E501"]
"atlas/recall.py" = ["E501"]
"atlas/details.py" = ["E501"]
"atlas/signal.py" = ["E501"]
"atlas/classlabels.py" = ["E501"]
"atlas/admit.py" = ["E501"]
"atlas/wdpa.py" = ["E501"]
"atlas/review.py" = ["E501"]
"atlas/geofacts.py" = ["E501"]
"atlas/kindrules.py" = ["E501"]
"atlas/capitals.py" = ["E501"]
"atlas/viewer.py" = ["E501"]
"tests/test_viewer.py" = ["E501"]
"tests/test_capitals.py" = ["E501"]
"tests/test_kindrules.py" = ["E501"]
"tests/test_geofacts.py" = ["E501"]
"atlas/pageviews.py" = ["E501"]
"atlas/tiercal.py" = ["E501"]
"tests/test_tiercal.py" = ["E501"]
"tests/test_pageviews.py" = ["E501"]
"tests/test_wdpa.py" = ["E501"]
"atlas/matching.py" = ["E501"]
"atlas/diagnose.py" = ["E501"]
"atlas/tiles.py" = ["E501"]
"scripts/*" = ["E501", "T20"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "atlas"]
addopts = "--doctest-modules"
