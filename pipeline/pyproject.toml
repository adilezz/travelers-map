[project]
name = "atlas-pipeline"
version = "2.0.0-m0"
description = "Place database pipeline and gates for the Travelers World Map"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]

[tool.setuptools.package-data]
atlas = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"atlas/gates.py" = ["E501"]
"atlas/bundle.py" = ["E501"]
"atlas/verify.py" = ["E501"]
"atlas/kinds.py" = ["E501"]
"atlas/minting.py" = ["E501"]
"atlas/qids.py" = ["E501"]
"atlas/snapshot.py" = ["E501"]
"atlas/wikidata.py" = ["E501"]
"atlas/extract.py" = ["E501"]
"atlas/recall.py" = ["E501"]
"atlas/details.py" = ["E501"]
"atlas/signal.py" = ["E501"]
"atlas/classlabels.py" = ["E501"]
"atlas/admit.py" = ["E501"]
"atlas/wdpa.py" = ["E501"]
"atlas/review.py" = ["E501"]
"tests/test_wdpa.py" = ["E501"]
"atlas/matching.py" = ["E501"]
"atlas/diagnose.py" = ["E501"]
"atlas/tiles.py" = ["E501"]
"scripts/*" = ["E501", "T20"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "atlas"]
addopts = "--doctest-modules"
